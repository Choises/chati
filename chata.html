<div style="background: #1e1e1e; padding: 15px; border-radius: 8px; font-family: Arial, sans-serif; color: #e0e0e0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; max-width: 100%; box-sizing: border-box;">
    
    <!-- ΚΥΛΙΟΜΕΝΗ ΜΠΑΡΑ ΑΝΑΚΟΙΝΩΣΕΩΝ (MARQUEE) -->
    <div style="background: #e74c3c; color: #fff; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px 4px 0 0; overflow: hidden; white-space: nowrap;">
        <marquee behavior="scroll" direction="left" scrollamount="4">
            📻 Καλώς ήρθατε στο Radio Live! Στείλτε μας τις αφιερώσεις, τα μηνύματα και τα φωνητικά σας ζωντανά στο studio... Καλή ακρόαση! 🎶
        </marquee>
    </div>

    <!-- Τίτλος & Online Μετρητής -->
    <div style="background: #2c3e50; color: white; padding: 12px; font-weight: bold; text-align: center; font-size: 16px; position: relative;">
        📻 Radio Live Chat
        <span id="online-counter" style="position: absolute; right: 15px; top: 12px; background: #27ae60; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;">Online: 0</span>
    </div>
    
    <!-- Χώρος Μηνυμάτων (Dark Φόντο) -->
    <div id="chat-messages" style="background: #121212; color: #e0e0e0; height: 350px; padding: 15px; overflow-y: auto; font-size: 14px; line-height: 1.5; border: 1px solid #333;">
        <div id="connection-status" style="color: #aaa; text-align: center; font-style: italic;">Σύνδεση στο chat...</div>
    </div>
    
    <!-- Μπάρα Εισαγωγής (Dark Inputs) -->
    <div style="padding: 10px 0 0 0; display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="chat-username" placeholder="Το όνομά σας..." style="padding: 8px; border: 1px solid #444; border-radius: 4px; font-size: 14px; background: #2c2c2c; color: #fff;" />
        
        <div style="display: flex; gap: 5px; align-items: center;">
            <!-- Κουμπί Μικροφώνου 🎙️ -->
            <button id="voice-btn" title="Κρατήστε πατημένο για ηχογράφηση φωνητικού" disabled style="background: #c0392b; color: white; border: none; width: 38px; height: 35px; border-radius: 4px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s;">🎙️</button>
            
            <input type="text" id="chat-message" placeholder="Γράψτε ένα μήνυμα..." disabled style="flex: 1; padding: 8px; border: 1px solid #444; border-radius: 4px; font-size: 14px; background: #2c2c2c; color: #fff;" />
            <button id="chat-send" disabled style="background: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; height: 35px;">Αποστολή</button>
        </div>
    </div>
</div>

<!-- ΕΓΓΥΗΜΕΝΟ LINK ΓΙΑ ΤΗ ΒΙΒΛΙΟΘΗΚΗ SOCKET.IO -->
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>

<script>
       // Σύνδεση με τον Socket.io Server σας στο Render
    const socket = io('https://panagiotis-live-chat.onrender.com/');

    // --- Links ήχων ---
    const soundJoin = new Audio('https://www.myinstants.com/media/sounds/ding-sound-effect_2.mp3'); 
    const soundSend = new Audio('https://www.myinstants.com/media/sounds/ding-sound-effect_2.mp3'); 
    const soundReceive = new Audio('https://www.myinstants.com/media/sounds/ding-sound-effect_2.mp3'); 

    soundJoin.volume = 0.4;
    soundSend.volume = 0.3;
    soundReceive.volume = 0.5;

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    const colors = ['#3498db', '#2ecc71', '#e74c3c', '#e67e22', '#9b59b6', '#f1c40f', '#1abc9c', '#00adb5', '#ff7675'];
    const userColor = colors[Math.floor(Math.random() * colors.length)];
    const myUserId = 'user_' + Math.random().toString(36).substr(2, 9);

    const messagesContainer = document.getElementById('chat-messages');
    const statusContainer = document.getElementById('connection-status');
    const usernameInput = document.getElementById('chat-username');
    const messageInput = document.getElementById('chat-message');
    const sendButton = document.getElementById('chat-send');
    const onlineCounter = document.getElementById('online-counter');
    const voiceButton = document.getElementById('voice-btn');

    let mediaRecorder = null;
    let audioChunks = [];
    let mediaStream = null;

    function linkify(text) {
        const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        return text.replace(urlPattern, function(url) {
            if (url.match(/\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i)) {
                return `<img src="${url}" style="max-width: 150px; max-height: 150px; border-radius: 5px; display: block; margin-top: 5px; border: 1px solid #444; cursor: pointer;" onclick="window.open('${url}', '_blank')" alt="Εικόνα Chat" />`;
            } else {
                return `<a href="${url}" target="_blank" style="color: #3498db; text-decoration: underline; font-weight: bold;">${url}</a>`;
            }
        });
    }

    socket.on('connect', () => {
        statusContainer.innerHTML = '🟢 Συνδεθήκατε στο Chat!';
        statusContainer.style.color = '#2ecc71';
        statusContainer.style.fontWeight = 'bold';
        messageInput.disabled = false;
        sendButton.disabled = false;

        // Ενεργοποιούμε το κουμπί αν η συσκευή υποστηρίζει μικρόφωνο
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            voiceButton.disabled = false;
        }
    });

    // 🎙️ ΝΕΟΣ ΕΝΙΣΧΥΜΕΝΟΣ ΜΗΧΑΝΙΣΜΟΣ ΦΩΝΗΤΙΚΩΝ (Ανοίγει & Κλείνει αμέσως!)
    async function startRecording(e) {
        e.preventDefault();
        audioChunks = [];
        
        try {
            // Ανοίγουμε το μικρόφωνο ΜΟΝΟ τώρα
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(mediaStream);
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                if (audioChunks.length === 0) return;
                
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                    sendVoiceMessage(reader.result);
                };
                
                // ΚΛΕΙΝΟΥΜΕ ΤΟ ΜΙΚΡΟΦΩΝΟ ΑΜΕΣΩΣ για να μην επηρεάζει το ραδιόφωνο
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
            };

            mediaRecorder.start();
            voiceButton.style.background = '#f1c40f'; // Κίτρινο
        } catch (err) {
            console.log('Σφάλμα έναρξης μικροφώνου:', err);
        }
    }

    function stopRecording(e) {
        e.preventDefault();
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            voiceButton.style.background = '#c0392b'; // Κόκκινο
        }
    }

    // Σύνδεση των listeners με ασφάλεια
    if (voiceButton) {
        voiceButton.addEventListener('mousedown', startRecording);
        voiceButton.addEventListener('touchstart', startRecording);
        voiceButton.addEventListener('mouseup', stopRecording);
        voiceButton.addEventListener('touchend', stopRecording);
    }

    function sendVoiceMessage(base64Data) {
        const username = usernameInput.value.trim() || 'Επισκέπτης';
        const uniqueMsgId = 'msg_' + Math.random().toString(36).substr(2, 9);
        soundSend.play().catch(e => console.log('Ήχος'));

        socket.emit('send-message', {
            isVoice: true,
            messageId: uniqueMsgId,
            name: username,
            message: base64Data,
            color: userColor,
            userId: myUserId
        });
    }

    socket.on('receive-message', (data) => {
        if (data.type === 'delete-message' || data.messageType === 'delete-message') {
            const elToRemove = document.getElementById(data.messageId);
            if (elToRemove) elToRemove.remove();
            return;
        }

        if (document.getElementById(data.messageId)) return;

        const messageElement = document.createElement('div');
        messageElement.id = data.messageId; 
        messageElement.style.marginBottom = '10px';
        messageElement.style.display = 'flex';
        messageElement.style.alignItems = 'flex-start';

        let deleteHtml = '';
        if (isAdmin) {
            deleteHtml = `<button style="background: #c0392b; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 8px; font-weight: bold; margin-top:2px;" onclick="requestDelete('${data.messageId}')">X</button>`;
        }

        if (data.isVoice) {
            messageElement.innerHTML = `${deleteHtml}<div><strong style="color: ${data.color || '#3498db'};">${data.name}:</strong> <audio controls style="margin-top: 5px; display: block; max-width: 240px; background: #2c2c2c; border-radius: 4px;" src="${data.message}"></audio></div>`;
        } else {
            const formattedText = linkify(data.message);
            messageElement.innerHTML = `${deleteHtml}<div><strong style="color: ${data.color || '#3498db'};">${data.name}:</strong> <span style="color: #e0e0e0;">${formattedText}</span></div>`;
        }

        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (data.userId !== myUserId) {
            soundReceive.play().catch(e => console.log('Ήχος'));
        }
    });

    socket.on('update-online', (count) => {
        onlineCounter.innerHTML = 'Online: ' + count;
    });

    function sendMessage() {
        const username = usernameInput.value.trim() || 'Επισκέπτης';
        const text = messageInput.value.trim();
        if (text === '') return;

        soundSend.play().catch(e => console.log('Ήχος'));
        const uniqueMsgId = 'msg_' + Math.random().toString(36).substr(2, 9);

        socket.emit('send-message', {
            messageId: uniqueMsgId,
            name: username,
            message: text,
            color: userColor,
            userId: myUserId
        });
        messageInput.value = '';
    }

    function requestDelete(msgId) {
        socket.emit('send-message', { type: 'delete-message', messageId: msgId });
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
 </script>
